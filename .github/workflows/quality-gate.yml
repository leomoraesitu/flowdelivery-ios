name: Quality Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup SwiftLint
        uses: ./.github/actions/setup-swiftlint

      - name: Tool versions
        run: |
          swiftformat --version
          swiftlint version

      - name: Format check
        run: ./Scripts/format-check.sh

      - name: Lint
        run: ./Scripts/lint.sh
