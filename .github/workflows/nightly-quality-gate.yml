name: Nightly Quality Gate

on:
  schedule:
    # 06:00 UTC = 03:00 America/Sao_Paulo
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  full-quality-gate:
    name: Full Quality Gate
    runs-on: macos-26
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      SIMULATOR_NAME: iPhone 17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup SwiftLint
        uses: ./.github/actions/setup-swiftlint

      - name: Run quality gate
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/FlowDeliveryDerivedData
        run: ./Scripts/quality.sh
