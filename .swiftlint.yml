included:
  - FlowDelivery

excluded:
  - Pods
  - .build
  - DerivedData

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_imports
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo
  - trailing_whitespace

# SwiftLint's default puts `isolation` (nonisolated/isolated) before `acl`
# (private/public/...); SwiftFormat's default puts it after. Moving `isolation`
# after `acl` here matches SwiftFormat, so `private nonisolated` satisfies both.
modifier_order:
  preferred_modifier_order:
    - override
    - acl
    - isolation
    - setterACL
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300

file_length:
  warning: 500
